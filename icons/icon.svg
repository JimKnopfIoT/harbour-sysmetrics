<?xml version="1.0" encoding="UTF-8"?>
<!--
  harbour-htdiag app icon.

  SILHOUETTE
  Harbour app-icon shape with TWO opposite sharp corners: sharp at top-left
  and bottom-right, rounded (R=86) at top-right and bottom-left.
  Path: M0,0 L86,0 A86,86 172,86 L172,172 L86,172 A86,86 0,86 Z

  MOTIF
  Live system-monitor readout: per-core load bars in the back, a bright pulse
  waveform (activity trace) across the front with a soft glow. Cool anthracite
  tile, cyan-to-green signal — the app's dark theme.

  Sizes generated by tools/make-icons.sh (86/108/128/172 + 256 preview).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="172" height="172" viewBox="0 0 172 172">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222834"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="154" y2="0">
      <stop offset="0" stop-color="#19d2ff"/>
      <stop offset="0.55" stop-color="#31e0a0"/>
      <stop offset="1" stop-color="#8ef94a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fb3"/>
      <stop offset="1" stop-color="#20323e"/>
    </linearGradient>
    <clipPath id="tileClip">
      <path d="M0,0 L86,0 A86,86 0 0 1 172,86 L172,172 L86,172 A86,86 0 0 1 0,86 Z"/>
    </clipPath>
  </defs>

  <path fill="url(#tile)" d="M0,0 L86,0 A86,86 0 0 1 172,86 L172,172 L86,172 A86,86 0 0 1 0,86 Z"/>

  <g clip-path="url(#tileClip)">
    <!-- per-core load bars: eight columns, varied heights -->
    <g fill="url(#bar)" opacity="0.55">
      <rect x="24"  y="96"  width="12" height="52" rx="2"/>
      <rect x="41"  y="70"  width="12" height="78" rx="2"/>
      <rect x="58"  y="108" width="12" height="40" rx="2"/>
      <rect x="75"  y="54"  width="12" height="94" rx="2"/>
      <rect x="92"  y="84"  width="12" height="64" rx="2"/>
      <rect x="109" y="62"  width="12" height="86" rx="2"/>
      <rect x="126" y="100" width="12" height="48" rx="2"/>
      <rect x="143" y="78"  width="12" height="70" rx="2"/>
    </g>

    <!-- baseline -->
    <line x1="18" y1="148" x2="154" y2="148" stroke="#3a4756" stroke-width="2" opacity="0.6"/>

    <!-- pulse glow, then the crisp trace over it -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18,92 46,92 58,92 68,44 82,120 96,74 108,92 128,92 154,92"
                stroke="url(#pulse)" stroke-width="12" opacity="0.18"/>
      <polyline points="18,92 46,92 58,92 68,44 82,120 96,74 108,92 128,92 154,92"
                stroke="url(#pulse)" stroke-width="5"/>
    </g>
    <circle cx="82" cy="120" r="5.5" fill="#8ef94a"/>
  </g>
</svg>
